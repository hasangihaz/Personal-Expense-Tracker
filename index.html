<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <!-- =================================
         NAVIGATION BAR
    ================================== -->

    <nav class="navbar">

        <div class="container">

            <h1>Personal Expense Tracker</h1>

        </div>

    </nav>



    <main class="container">


        <!-- =================================
             SUMMARY CARDS
        ================================== -->

        <section class="summary">


            <div class="summary-card income-card">

                <h3>Total Income</h3>

                <p id="totalIncome">
                    LKR 0.00
                </p>

            </div>



            <div class="summary-card expense-card">

                <h3>Total Expenses</h3>

                <p id="totalExpenses">
                    LKR 0.00
                </p>

            </div>



            <div class="summary-card balance-card">

                <h3>Current Balance</h3>

                <p id="currentBalance">
                    LKR 0.00
                </p>

            </div>


        </section>



        <!-- =================================
             ADD TRANSACTION FORM
        ================================== -->

        <section class="form-section">


            <h2>Add Transaction</h2>


            <form id="transactionForm">


                <!-- Transaction Type -->

                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select id="type" required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="Income">
                            Income
                        </option>

                        <option value="Expense">
                            Expense
                        </option>

                    </select>

                </div>



                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                        required
                    >

                </div>



                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount (LKR)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>



                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Allowance">
                            Allowance
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- Date -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>



                <!-- Buttons -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="add-button"
                    >
                        Add Transaction
                    </button>


                    <button
                        type="button"
                        id="clearButton"
                        class="clear-button"
                    >
                        Clear
                    </button>

                </div>


            </form>

        </section>



        <!-- =================================
             TRANSACTION HISTORY
        ================================== -->

        <section class="history-section">


            <h2>Transaction History</h2>


            <!-- Filter and Search -->

            <div class="history-controls">


                <div class="control-group">

                    <label for="filter">
                        Filter by Type
                    </label>

                    <select id="filter">

                        <option value="All">
                            All Transactions
                        </option>

                        <option value="Income">
                            Income Only
                        </option>

                        <option value="Expense">
                            Expenses Only
                        </option>

                    </select>

                </div>



                <div class="control-group">

                    <label for="searchInput">
                        Search Transactions
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by description or category"
                    >

                </div>


            </div>



            <!-- Transaction Table -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Date</th>

                            <th>Description</th>

                            <th>Type</th>

                            <th>Category</th>

                            <th>Amount (LKR)</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="transactionTableBody">

                        <!-- Transactions will be added here -->

                    </tbody>

                </table>

            </div>



            <!-- No Transactions Message -->

            <p
                id="noTransactions"
                class="no-transactions"
            >
                No transactions found.
            </p>


        </section>


    </main>



    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        <p>
            Personal Expense Tracker
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
